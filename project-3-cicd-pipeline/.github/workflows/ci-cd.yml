name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "project-3-cicd-pipeline/**"
  pull_request:
    branches: [main]
    paths:
      - "project-3-cicd-pipeline/**"

env:
  APP_DIR: project-3-cicd-pipeline/app

jobs:
  # -----------------------------------------------
  # Job 1: Test
  # -----------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          cd ${{ env.APP_DIR }}
          pytest test_app.py -v

  # -----------------------------------------------
  # Job 2: Build Docker Image
  # -----------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd ${{ env.APP_DIR }}
          docker build -t cicd-demo:${{ github.sha }} .
          docker tag cicd-demo:${{ github.sha }} cicd-demo:latest

      - name: Test Docker container
        run: |
          docker run -d --name test-container -p 5000:5000 cicd-demo:latest
          sleep 3
          curl -f http://localhost:5000/health || exit 1
          docker stop test-container

  # -----------------------------------------------
  # Job 3: Deploy (only on push to main)
  # -----------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get EC2 instance IP
        id: ec2
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=cicd-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PublicIpAddress" \
            --output text)
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.ip }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull latest code
            cd /opt/app
            sudo git pull origin main

            # Rebuild and restart container
            cd project-3-cicd-pipeline/app
            sudo docker build -t cicd-demo .
            sudo docker stop cicd-app || true
            sudo docker rm cicd-app || true
            sudo docker run -d --name cicd-app -p 80:5000 --restart always cicd-demo

            echo "Deployment complete!"