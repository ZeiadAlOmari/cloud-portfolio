# Project 11: secure container supply chain for Project 3's app.
#   pull request -> unit tests + Checkov + build once, smoke test, Trivy gate, SBOM (nothing published)
#   push to main -> the same, then publish the exact image that was tested: push to GHCR by digest,
#                   sign it and attach the SBOM with keyless cosign (GitHub OIDC), verify the signature,
#                   then deploy that digest through SSM (no SSH) while P11_DEPLOY_ENABLED is 'true'.
# Fixes Project 8 findings F-29 (SSH deploys), F-30 (tested != deployed) and F-32 (no image scan, tag-pinned actions).
# Every action is pinned to a full commit SHA. Trivy runs as a checksum-verified binary, not trivy-action,
# whose tags were hijacked in March 2026. Releases are adopted only after about 14 days.
name: P11 Supply chain

on:
  pull_request:
    branches: [main]
    paths:
      - "project-11-secure-supply-chain/**"
      - "!project-11-secure-supply-chain/**/*.md"
      - "!project-11-secure-supply-chain/diagrams/**"
      - "!project-11-secure-supply-chain/evidence/**"
      - ".github/workflows/p11-supply-chain.yml"
  push:
    branches: [main]
    paths:
      - "project-11-secure-supply-chain/**"
      - "!project-11-secure-supply-chain/**/*.md"
      - "!project-11-secure-supply-chain/diagrams/**"
      - "!project-11-secure-supply-chain/evidence/**"
      - ".github/workflows/p11-supply-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # sets pipefail

concurrency:
  group: p11-supply-chain
  cancel-in-progress: false

env:
  APP_DIR: project-11-secure-supply-chain/app
  IMAGE: ghcr.io/zeiadalomari/cloud-portfolio/p11-app
  CHECKOV_VERSION: "3.4.5"
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0 # trivy_0.76.1_Linux-64bit.tar.gz

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies (hash-checked when the file carries hashes)
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run tests
        working-directory: ${{ env.APP_DIR }}
        run: python -m pytest -q

  checkov:
    name: Policy gate (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: pip install --quiet "checkov==${CHECKOV_VERSION}"
      - name: Scan the Dockerfile
        run: checkov --framework dockerfile --compact -d "${APP_DIR}"
      - name: Scan this workflow
        run: checkov --framework github_actions --compact -f .github/workflows/p11-supply-chain.yml

  build:
    name: Build once, smoke test, Trivy gate, SBOM
    needs: tests # not Checkov: every gate reports its verdict; publish requires all of them
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.build.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy (pinned version, checksum verified)
        run: |
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy && sudo install -m 0755 trivy /usr/local/bin/trivy && rm -f trivy trivy.tgz
          trivy --version
      - name: Build the image (the only build)
        id: build
        run: |
          docker build --tag "${IMAGE}:${GITHUB_SHA}" "${APP_DIR}"
          ID=$(docker image inspect --format '{{.Id}}' "${IMAGE}:${GITHUB_SHA}")
          echo "image_id=${ID}" >> "$GITHUB_OUTPUT"
          echo "Built ${IMAGE}:${GITHUB_SHA} with image ID ${ID}"
      - name: Smoke test the built image
        run: |
          PORT=$(docker image inspect --format '{{range $p, $_ := .Config.ExposedPorts}}{{$p}}{{end}}' "${IMAGE}:${GITHUB_SHA}" | cut -d/ -f1)
          docker run -d --name smoke -p "8080:${PORT}" "${IMAGE}:${GITHUB_SHA}"
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/health
      - name: Non-root gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          U=$(docker exec smoke id -u)
          echo "container user id: ${U}"
          [ "${U}" != "0" ] || { echo "::error::container runs as root"; exit 1; }
      - name: Vulnerability gate (High and Critical with a fix available)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --format table "${IMAGE}:${GITHUB_SHA}" | tee trivy-report.txt
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}:${GITHUB_SHA}" > /dev/null
      - name: SBOM (CycloneDX)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: trivy image --quiet --format cyclonedx --output sbom.cdx.json "${IMAGE}:${GITHUB_SHA}"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## P11 build"
            echo "- Image ID: \`${{ steps.build.outputs.image_id }}\`"
            echo "- SBOM components: $(jq '.components | length' sbom.cdx.json 2>/dev/null || echo n/a)"
            echo '### Trivy (High/Critical, all)'
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the tested image for publishing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "${IMAGE}:${GITHUB_SHA}" | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tested-image
          path: |
            image.tar.gz
            sbom.cdx.json
          retention-days: 1

  publish:
    name: Publish by digest, sign, attest SBOM
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, checkov]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing with the workflow's OIDC identity
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
      - name: Load the tested image and confirm it is the same one
        run: |
          gunzip -c image.tar.gz | docker load
          ID=$(docker image inspect --format '{{.Id}}' "${IMAGE}:${GITHUB_SHA}")
          echo "loaded ${ID}, tested ${{ needs.build.outputs.image_id }}"
          [ "${ID}" = "${{ needs.build.outputs.image_id }}" ] || { echo "::error::image differs from the tested one"; exit 1; }
      - name: Push to GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${GITHUB_SHA}"
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}" | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${DIGEST}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attest (keyless)
        run: |
          REF="${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign sign --yes "${REF}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${REF}"
      - name: Verify signature and SBOM attestation
        run: |
          REF="${IMAGE}@${{ steps.push.outputs.digest }}"
          ID="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/p11-supply-chain.yml@refs/heads/main"
          cosign verify --certificate-identity "${ID}" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${REF}" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "${ID}" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${REF}" > /dev/null
          {
            echo "## P11 published"
            echo "- Image: \`${REF}\`"
            echo "- Tested image ID: \`${{ needs.build.outputs.image_id }}\`"
            echo "- Signed by: \`${ID}\`"
            echo "- Signature and SBOM attestation verified ✅"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-disabled:
    name: Deploy switch is off
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.P11_DEPLOY_ENABLED != 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Report that deploy was skipped
        run: |
          echo "::notice title=P11 not deployed::Repository variable P11_DEPLOY_ENABLED is not 'true'; deploy skipped on purpose."
          echo "P11 deploy skipped: deploy switch P11_DEPLOY_ENABLED is off. The image is still published and signed." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy by digest via SSM (no SSH)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.P11_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume gha-p11-deploy through GitHub OIDC
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_P11_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gha-p11-deploy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Send the deploy document (the instance verifies the signature itself)
        run: |
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=p11-app Name=instance-state-name,Values=running \
                --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "${IID}" != "None" ] && [ -n "${IID}" ] || { echo "::error::no running p11-app instance"; exit 1; }
          CID=$(aws ssm send-command --document-name p11-deploy --instance-ids "${IID}" \
                --parameters "Digest=${DIGEST}" --comment "P11 run ${GITHUB_RUN_ID}" --query Command.CommandId --output text)
          echo "command ${CID} on ${IID} for ${DIGEST}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "${CID}" --instance-id "${IID}" --query Status --output text 2>/dev/null || echo Pending)
            case "${STATUS}" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          OUT=$(aws ssm get-command-invocation --command-id "${CID}" --instance-id "${IID}" --query StandardOutputContent --output text)
          ERR=$(aws ssm get-command-invocation --command-id "${CID}" --instance-id "${IID}" --query StandardErrorContent --output text)
          echo "${OUT}"
          {
            echo "## P11 deploy"
            echo "- Digest: \`${DIGEST}\`"
            echo "- SSM status: **${STATUS}**"
            echo '```'
            echo "${OUT}" | tail -n 8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${STATUS}" = "Success" ] || { echo "${ERR}" | tail -n 20; echo "::error::deploy ${STATUS}"; exit 1; }
